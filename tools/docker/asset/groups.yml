###########################################################################
# Player Group Database
###########################################################################
#
# Player Group Settings
#
###########################################################################
# - Id                    Group ID.
#   Name                  Group name.
#   Level                 GM Level used for ranking groups. (Default: 0)
#   LogCommands           Whether atcommands should be logged or not. (Default: false)
#   Commands:             List of atcommands that can be used by this group. (Default: none)
#     <atcommand name>    Whether the specified atcommand can be used by this group or not.
#   CharCommands:         List of charcommands that can be used by this group. (Default: none)
#     <charcommand name>  Whether the specified charcommand can be used by this group or not.
#   Permissions:          List of permissions the group has. (Default: none)
#     <permission name>   Whether the group has this permission or not.
#   Inherit:              List of groups that will be inherited. (Default: none)
#     <group name>        Whether this group will be inherited or not.
###########################################################################

Header:
  Type: PLAYER_GROUP_DB
  Version: 1

# SeROja (PLAN-015 / Phase 2a): give every regular player (group 0) a generous
# quality-of-life command set.
#
# The group DB import MERGES into the stock definition, so this Body lists ONLY
# the additions — re-declaring a stock command (changedress/resurrect) or the
# stock Permissions is a "Group already has command" error that rejects the whole
# import. Stock group 0 keeps can_trade / can_party / attendance untouched.
#
# NOT granted: @item @spawn @monster @zeny @heal(others) @kick @ban @mount ... —
# those stay group 99 (Admin). @warp to arbitrary coords also stays GM; players
# use @go + the Warper NPC.
Body:
  - Id: 0
    Commands:
      commands: true
      rates: true
      time: true
      refresh: true
      noks: true
      showexp: true
      showdelay: true
      go: true
      autoloot: true
      autolootitem: true
      autotrade: true
      storage: true
      guildstorage: true
      monsterinfo: true
      iteminfo: true
      whodrops: true
      whereis: true
      exp: true
