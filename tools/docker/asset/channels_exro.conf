// eXRo — Channel System Configuration  (PLAN-018 Phase D / D6b)
// ---------------------------------------------------------------------------
// Tracked asset. Loaded because the eXRo map_conf.txt asset sets
//   channel_conf: conf/import/channels_exro.conf
// (overriding map_athena.conf's default `channel_conf: conf/channels.conf`).
// Mounted to that path by run-nopod.sh / run-prod.sh / docker-compose.AIO.yaml.
//
// This is the WHOLE channel_config block — rAthena does not merge channel
// config, the named file replaces the default. Kept structurally identical to
// stock conf/channels.conf; the eXRo changes are only:
//   * added "#main" to the channels list — global, autojoin, cannot leave
//   * flipped map.autojoin to true — every player auto-joins their map's "#map"
// ---------------------------------------------------------------------------
channel_config: {

	colors: {
		Default: "0xffffff"
		Red: "0xff0000"
		Blue: "0x83cfe9"
		Orange: "0xe57c00"
		Cyan: "0x00b89d"
		Yellow: "0xffff90"
		Green: "0x28bf00"
		White: "0xFFFFFF"
		Purple: "0xD67FFF"
		LightGreen: "0xB6FF00"
		Normal: "0x00ff00"
	}

	private_channel: {
		allow: true
		color: "Default"
		delay: 1000
		max_member: 1000
		self_notif: true
		join_notif: false
		leave_notif: false
		ban: true
		kick: true
		color_override: false
		change_delay: false
	}

	channels: (
	{
		// eXRo server-wide chat. Auto-joined, sticky (matches DewataRO's #main).
		name: "#main"
		alias: "[Main]"
		color: "White"
		type: "CHAN_TYPE_PUBLIC"
		delay: 1000
		autojoin: true
		leave: false
		chat: true
	},
	{
		name: "#global"
		alias: "[Global]"
		color: "White"
		type: "CHAN_TYPE_PUBLIC"
		delay: 1000
		autojoin: false
		leave: false
	},
	{
		name: "#support"
		alias: "[Support]"
		color: "Blue"
		type: "CHAN_TYPE_PUBLIC"
		delay: 1000
		autojoin: false
	},
	{
		name: "#trade"
		alias: "[Trade]"
		color: "LightGreen"
		type: "CHAN_TYPE_PUBLIC"
		delay: 1000
		autojoin: false
	}
	)

	ally: {
		name: "#ally"
		alias: "[Ally]"
		color: "Green"
		type: "CHAN_TYPE_ALLY"
		delay: 1000
		autojoin: false
		leave: true
		chat: true
	}

	map: {
		name: "#map"
		alias: "[Map]"
		color: "Yellow"
		type: "CHAN_TYPE_MAP"
		delay: 1000
		autojoin: true
		leave: true
		chat: true
	}
}
